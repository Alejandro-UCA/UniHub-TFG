version: '3.8'

# ==============================================================================
# Orquestador Docker Compose: Proyecto UniHub Universidades y Titulaciones
# (Arranque conjunto automático de Fases 1, 2, 3 y 4)
# ==============================================================================

networks:
  unihub_network:
    driver: bridge
    name: unihub_network

volumes:
  postgres_data:
    name: unihub_postgres_data

services:
  # ----------------------------------------------------------------------------
  # CONTENEDOR 1: Base de Datos PostgreSQL (Fase 2)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: unihub_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unihub_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_API_USER: ${POSTGRES_API_USER:-unihub_api_user}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:-unihub_api_password_sec2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../API/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../API/database/02_security.sh:/docker-entrypoint-initdb.d/02_security.sh:ro
    ports:
      - "5432:5432"
    networks:
      - unihub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-unihub_db}"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------------------------
  # CONTENEDOR 2: Rastreador / Crawler UniHub (Fase 1) - Programación Cron 0 2 1 * *
  # ----------------------------------------------------------------------------
  crawler:
    build:
      context: ../..
      dockerfile: Codigo/Docker/crawler/Dockerfile
    container_name: unihub_crawler
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - CRAWLER_CRON_SCHEDULE=${CRAWLER_CRON_SCHEDULE:-0 2 1 * *}
      - CRAWLER_REQUEST_DELAY=${CRAWLER_REQUEST_DELAY:-1.0}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-unihub_super_secret_admin_key_2026}
    volumes:
      - ../Crawler/Datos:/app/Datos
    networks:
      - unihub_network

  # ----------------------------------------------------------------------------
  # CONTENEDOR 3: API REST Python / FastAPI (Fase 2)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: Codigo/Docker/api/Dockerfile
    container_name: unihub_api
    restart: always
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-unihub_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      API_DB_USER: ${POSTGRES_API_USER:-unihub_api_user}
      API_DB_PASSWORD: ${POSTGRES_API_PASSWORD:-unihub_api_password_sec2026}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-unihub_super_secret_admin_key_2026}
    volumes:
      - ../Crawler/Datos:/app/Datos
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - unihub_network
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # CONTENEDOR 4: Portal Web Frontend Nginx + React (Fase 3)
  # ----------------------------------------------------------------------------
  www:
    build:
      context: ../..
      dockerfile: Codigo/Docker/www/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_ADMIN_USER: ${VITE_ADMIN_USER:-admin}
        VITE_ADMIN_FEES: ${VITE_ADMIN_FEES:-45.00}
        VITE_BECA_MEC_REFERENCE_PRICE: ${VITE_BECA_MEC_REFERENCE_PRICE:-1008}
    container_name: unihub_www
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_ALT_PORT:-5173}:80"
    networks:
      - unihub_network
    depends_on:
      - api
