# ==============================================================================
# Orquestador Docker Compose: Proyecto UniHub Universidades y Titulaciones
# (Arranque conjunto automático de Fases 1, 2, 3 y 4)
# ==============================================================================

networks:
  unihub_network:
    driver: bridge
    name: unihub_network

volumes:
  postgres_data:
    name: unihub_postgres_data

services:
  # ----------------------------------------------------------------------------
  # CONTENEDOR 1: Base de Datos PostgreSQL (Fase 2)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: unihub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-unihub_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse}
      POSTGRES_API_USER: ${POSTGRES_API_USER:?POSTGRES_API_USER debe configurarse}
      POSTGRES_API_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD debe configurarse}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../API/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../API/database/02_security.sh:/docker-entrypoint-initdb.d/02_security.sh:ro
    networks:
      - unihub_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-unihub_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ----------------------------------------------------------------------------
  # CONTENEDOR 2: Rastreador / Crawler UniHub (Fase 1) - Programación Cron 0 2 1 * *
  # ----------------------------------------------------------------------------
  crawler:
    build:
      context: ../..
      dockerfile: Codigo/Docker/crawler/Dockerfile
    container_name: unihub_crawler
    restart: unless-stopped
    environment:
      PYTHONUNBUFFERED: "1"
      CRAWLER_CRON_SCHEDULE: ${CRAWLER_CRON_SCHEDULE:?CRAWLER_CRON_SCHEDULE debe configurarse}
      CRAWLER_REQUEST_DELAY: ${CRAWLER_REQUEST_DELAY:-1.0}
      CRAWLER_RUN_ON_STARTUP: ${CRAWLER_RUN_ON_STARTUP:-true}
      CRAWLER_PARTS_ARGS: ${CRAWLER_PARTS_ARGS:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:-}
      API_SYNC_URL: ${API_SYNC_URL:-http://api:8000/api/v1/admin/sync-etl}
      CRAWLER_API_SYNC_TIMEOUT: ${CRAWLER_API_SYNC_TIMEOUT:-600}
      CRAWLER_PRICE_CATALOG_ACADEMIC_YEAR: ${CRAWLER_PRICE_CATALOG_ACADEMIC_YEAR:-}
      CRAWLER_PRICE_CATALOG_VERIFIED: ${CRAWLER_PRICE_CATALOG_VERIFIED:-false}
      PLAYWRIGHT_EXECUTABLE_PATH: ${PLAYWRIGHT_EXECUTABLE_PATH:-/usr/bin/chromium}
    volumes:
      - ../Crawler/Datos:/app/Datos
    networks:
      - unihub_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # CONTENEDOR 3: API REST Python / FastAPI (Fase 2)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: ../..
      dockerfile: Codigo/Docker/api/Dockerfile
    container_name: unihub_api
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:?ENVIRONMENT debe configurarse}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-unihub_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD debe configurarse}
      API_DB_USER: ${POSTGRES_API_USER:?POSTGRES_API_USER debe configurarse}
      API_DB_PASSWORD: ${POSTGRES_API_PASSWORD:?POSTGRES_API_PASSWORD debe configurarse}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ADMIN_API_KEYS: ${ADMIN_API_KEYS:-}
      TRUST_PROXY_HEADERS: "true"
      TRUSTED_PROXY_NETWORKS: "172.16.0.0/12"
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS debe configurarse}
    volumes:
      - ../Crawler/Datos:/app/Datos
    expose:
      - "8000"
    networks:
      - unihub_network
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/salud || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ----------------------------------------------------------------------------
  # CONTENEDOR 4: Portal Web Frontend Nginx + React (Fase 3)
  # ----------------------------------------------------------------------------
  www:
    build:
      context: ../..
      dockerfile: Codigo/Docker/www/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
        VITE_ADMIN_FEES: ${VITE_ADMIN_FEES:?VITE_ADMIN_FEES debe configurarse}
        VITE_BECA_MEC_REFERENCE_PRICE: ${VITE_BECA_MEC_REFERENCE_PRICE:?VITE_BECA_MEC_REFERENCE_PRICE debe configurarse}
    container_name: unihub_www
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    networks:
      - unihub_network
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
